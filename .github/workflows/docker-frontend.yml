name: Build and Push Frontend Image

on:
  push:
    branches: [ develop ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push frontend (latest and short-sha)
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER_LOWER="${OWNER,,}"
          SHORT_SHA="${SHA::8}"
          IMAGE="ghcr.io/${OWNER_LOWER}/amazon-dip-frontend"
          echo "Building image: $IMAGE (tags: latest, $SHORT_SHA)"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" ./frontend
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"
